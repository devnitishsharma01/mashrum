services:
  postgres:
    image: postgres:16-alpine
    container_name: mashrum-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: mashrum
      POSTGRES_PASSWORD: mashrum
      POSTGRES_DB: mashrum
    volumes:
      - mashrum_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mashrum -d mashrum"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mashrum-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - mashrum_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mashrum_pg_data:
  mashrum_redis_data:
